<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>RepX</title>
    <style>
      html, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
      #root {
        display: flex;
        flex-direction: column;
      }
      
      /* Fix touch scrolling on mobile web browsers */
      /* Allow scrolling through any element with role="button" */
      [role="button"] {
        touch-action: manipulation;
      }
      
      /* Ensure all scrollable areas work on mobile */
      * {
        -webkit-tap-highlight-color: transparent;
      }
      
      /* Allow vertical scrolling in scrollable containers */
      [data-focusable="true"],
      [tabindex] {
        touch-action: pan-y pinch-zoom;
      }
    </style>
  </head>
  <body>
    <!-- Polyfill for import.meta used by zustand and other packages -->
    <script>
      if (typeof window !== 'undefined') {
        window.importMeta = { env: { MODE: 'production', DEV: false, PROD: true } };
      }
    </script>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
